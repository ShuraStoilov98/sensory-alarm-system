<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570" role="img" aria-labelledby="title desc">
  <title id="title">ESP32 curtain controller connection overview</title>
  <desc id="desc">USB powers the ESP32. GPIO25, 26 and 27 control STEP, DIR and ENABLE on the DRV8825. Four active-low inputs connect switches to ground. A separate 9 volt supply powers VMOT. RESET and SLEEP are held high from ESP32 3.3 volts. The driver powers the motor and all grounds are shared. This is a functional overview, not a physical carrier pinout.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#52657b"/></marker>
    <style>
      text { font-family: system-ui, sans-serif; fill: #172b43; }
      .title { font-size: 26px; font-weight: 700; }
      .name { font-size: 21px; font-weight: 650; }
      .label { font-size: 16px; }
      .note { font-size: 15px; fill: #52657b; }
      .box { fill: #f5f8fc; stroke: #a8b8ca; stroke-width: 1.5; rx: 12; }
      .wire { fill: none; stroke: #52657b; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1100" height="570" fill="white" rx="16"/>
  <text x="38" y="45" class="title">Curtain controller connections</text>
  <text x="38" y="74" class="note">Functional connections · verify the exact carrier pinout before wiring</text>

  <rect x="38" y="117" width="235" height="178" class="box"/>
  <text x="58" y="149" class="name">Physical inputs</text>
  <text x="58" y="183" class="label">GPIO14 · hold-to-run</text>
  <text x="58" y="210" class="label">GPIO13 · direction</text>
  <text x="58" y="237" class="label">GPIO32 · opened limit</text>
  <text x="58" y="264" class="label">GPIO33 · closed limit</text>
  <path d="M273 205H326" class="wire"/>

  <rect x="333" y="117" width="218" height="178" class="box"/>
  <text x="356" y="158" class="name">ESP32 DevKit</text>
  <text x="356" y="199" class="label">GPIO25 → STEP</text>
  <text x="356" y="229" class="label">GPIO26 → DIR</text>
  <text x="356" y="259" class="label">GPIO27 → ENABLE</text>
  <path d="M551 205H604" class="wire"/>

  <rect x="611" y="117" width="218" height="178" class="box"/>
  <text x="634" y="158" class="name">DRV8825</text>
  <text x="634" y="199" class="label">STEP / DIR / ENABLE</text>
  <text x="634" y="229" class="label">RESET + SLEEP → 3V3</text>
  <text x="634" y="259" class="label">VMOT + GND</text>
  <path d="M829 205H882" class="wire"/>

  <rect x="889" y="117" width="173" height="178" class="box"/>
  <text x="908" y="160" class="name">NEMA17</text>
  <text x="908" y="199" class="label">A1 / A2 · coil A</text>
  <text x="908" y="229" class="label">B1 / B2 · coil B</text>
  <text x="908" y="266" class="note">Verify coil pairs</text>

  <rect x="333" y="359" width="218" height="78" class="box"/>
  <text x="356" y="390" class="name">5V USB power</text>
  <text x="356" y="417" class="label">Via ESP32 USB only</text>
  <path d="M442 359V301" class="wire"/>

  <rect x="611" y="359" width="451" height="78" class="box"/>
  <text x="634" y="390" class="name">Separate 9V motor supply</text>
  <text x="634" y="417" class="label">+ → VMOT; − → GND; 100µF nearby across both</text>
  <path d="M720 359V301" class="wire"/>

  <text x="38" y="335" class="note">Each input switch connects its GPIO to common GND when active.</text>
  <rect x="38" y="470" width="1024" height="62" rx="10" fill="#eaf3f2"/>
  <text x="58" y="495" class="label">Common ground: ESP32 GND ↔ driver GND ↔ motor PSU negative ↔ all switch grounds</text>
  <text x="58" y="518" class="note">No VDD logic-supply pin on standard DRV8825 carriers. Set current limit for the actual motor and carrier.</text>
</svg>
